[workspace]
members = [
    "p63-spec",
    "p63-core",
    "p63-asm",
    "p63-dis",
    "p63-sim",
    "p63-cart",
    "p63-bus",
    "p63-ppu",
    "p63-apu",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
authors = ["Paradox63 Team"]
edition = "2021"

[workspace.dependencies]
bitflags = "2.4"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1.4"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
rustyline = "13.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
